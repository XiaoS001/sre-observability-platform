name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 会取消正在跑的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法编译检查
        run: |
          python -m compileall -q app.py models.py config.py scheduler.py \
            alerts.py auth.py reports.py run_due_targets.py

      - name: 跑测试
        run: python -m pytest tests -p no:warnings -q

      - name: 密钥扫描（代码里不许有明文 key）
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{16,}|api_key[[:space:]]*=[[:space:]]*['\"]" \
               --include='*.py' --include='*.yml' --include='*.sh' .; then
            echo "❌ 检测到疑似明文密钥"
            exit 1
          fi
          echo "✅ 未发现明文密钥"

      - name: 测试库隔离检查（测试跑完后 data/ 不该有 db 文件）
        run: |
          # CI 是干净 checkout，data/ 本来就不存在。
          # 所以判据不是「data/ 有没有 db」而是「测试跑完有没有新建出来」——
          # 有就说明测试绕过了 conftest 的隔离断言，污染了真实业务库路径。
          if [ -f data/rmb03.db ]; then
            echo "❌ 测试污染了真实业务库路径 data/rmb03.db"
            ls -la data/
            echo "   检查 tests/conftest.py 的模块级环境变量与 create_app(init_db=...)"
            exit 1
          fi
          echo "✅ 测试未写入 data/"

  docker-build:
    name: 构建镜像并推送 GHCR
    runs-on: ubuntu-latest
    needs: test          # 测试不过就不构建
    permissions:
      contents: read
      packages: write   # 推 GHCR 必需
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建镜像（不运行）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像构建信息
        run: |
          echo "✅ 镜像已推送到 ghcr.io/${{ env.IMAGE_NAME }}"
          echo "   latest 与 ${{ github.sha }} 两个 tag"
          echo "   🔖 注意：本 job 只构建不运行容器运行态验证"