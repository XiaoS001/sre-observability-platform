# Grafana 数据源自动配置（RMB03）
#
# 为什么用 provisioning：容器是一次性的，没法手工点 UI。
# 启动时自动注册 Prometheus 与 Loki 两个数据源，
# 否则「一条命令起全套」只起了进程，界面还得手工配。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000