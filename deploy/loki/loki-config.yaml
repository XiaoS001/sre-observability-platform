# Loki 配置（RMB03）
#
# 基于 D:\CodexXM\_tools\loki\loki-local-config.yaml 改造：
#   · 去掉 ruler（告警由 RMB03 自己管，不引 Alertmanager —— 任务单边界）
#   · 去掉 pattern_ingester（单机演示用不上）
#   · path_prefix 指向容器内挂载卷
# 🔴 本地开发要跑原生 Windows 版时，直接用 _tools 里那份原配置。

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 天
  allow_structured_metadata: false

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false